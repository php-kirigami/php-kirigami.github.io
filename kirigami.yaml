# yaml-language-server: $schema=https://cdn.jsdelivr.net/gh/php-kirigami/kirigami@main/packages/kirigami/kirigami.schema.json

kirigami:
  project:     Kirigami
  baseurl:     https://php-kirigami.github.io
  root:        src
  banner:      banner.txt

  # Any other key here is free-form project data: it becomes a PHP variable of
  # the same name on every page and in the header / footer includes.
  author:      Maxime Larrivée-Roy
  email:       mlarriveeroy@gmail.com
  repo:        https://github.com/php-kirigami/kirigami
  description: >-
    A static site generator that turns PHP into fast, dependency-free HTML —
    no server required. Real PHP templates, compiled to plain HTML by PHP
    running in WebAssembly, right inside Node.
  keywords:    [static site generator, php, webassembly, kirigami, zero dependency, github pages]
  tagline:     Fold PHP into flat HTML.


# SEO: <title>, description, keywords, Open Graph, Twitter Card, canonical,
# favicon and a schema.org JSON-LD graph, all from this one block, the
# `kirigami:` keys above and each page's PHPDOC (@title, @description, @image,
# @robots, …). Tags _layouts/header.php already writes by hand are skipped.
# favicon / appleTouchIcon / image point at the PNGs and og:image webp that the
# IMG::asset() calls in _layouts/header.php generate. `jsonld: false` would
# drop the JSON-LD.
seo:
  favicon:        images/meta/favicon-48x48.png
  appleTouchIcon: images/meta/favicon-180x180.png
  image:          images/meta/ogimage-1200x630-cover.webp


prepros:
  before:   _layouts/header.php   # prepended to every page
  after:    _layouts/footer.php   # appended to every page
  format:   true
  network:  true                  # build-time npm version lookups (ecosystem/changelog), remote @tag fetches
  includes: [_lib/functions.php]  # register custom tags / shortcodes / hooks here
  types:                          # a page opts in with @type <name>
    doc:                          # page head: breadcrumb, eyebrow, title, lead
      before: _layouts/types/doc.before.php
    guide:                        # doc head + prev/next along the Getting started path
      before: _layouts/types/guide.before.php
      after:  _layouts/types/guide.after.php


# The image autogenerator. Source originals in assets/images/ (rel. to cwd),
# derivatives land in src/images/ (rel. to kirigami.root) — see the live demo
# on /docs/php/#img (<img asset>, sized and cropped from the same source file).
image:
  format: webp
  source: assets/images
  dest:   images


plugins:
  # Build-time syntax highlighting — every fenced code block on the site (docs,
  # tutorials, the config reference) is colored at build time. 0 bytes of
  # highlight.js reach the browser.
  - name: "@kirigami/plugin-highlight"
    active: true
    options:
      languages: [yaml, php, javascript, bash, shell, json, scss, xml]  # xml = highlight.js's module for html/svg/xml too (see todo.md)
      theme: none  # built-in preset clashed with the site's warm palette — own theme in styles/partials/_highlight-theme.scss
      copyButton: true
      tag: true
      embedFont: false  # JetBrains Mono is already embedded site-wide as --font-mono, via $fonts in _conf.scss

  # External link preview card — live demo on /plugins/.
  - name: "@kirigami/plugin-extlink"
    active: true

  # YouTube/Vimeo oEmbed video card — live demo on /plugins/.
  - name: "@kirigami/plugin-embed"
    active: true


sass:
  # style: expanded


tasks:
  - name:  css-core
    type:  sass
    entry: styles/kirigami.core.scss

  - name:  js-core
    type:  esbuild
    entry: scripts/kirigami.core.js
